name: Bug
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is proprietary. See LICENSE.
        Do not paste secrets, tokens, or `.env` contents.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Short description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - api
        - admin
        - deploy
        - other
    validations:
      required: true
